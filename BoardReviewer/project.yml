# Board Reviewer: Brian's own app for approving or denying new Chipmunk Challenge boards. Separate from the game.
# Generate the Xcode project with XcodeGen:  cd BoardReviewer && xcodegen
name: BoardReviewer
options:
  bundleIdPrefix: com.groveseng
  deploymentTarget:
    iOS: "17.0"
targets:
  BoardReviewer:
    type: application
    platform: iOS
    sources:
      - path: BoardReviewer
    info:
      path: BoardReviewer/Info.plist
      properties:
        CFBundleDisplayName: Board Review
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.groveseng.boardreviewer
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: 4ET52CG8GF
        CODE_SIGN_STYLE: Automatic
