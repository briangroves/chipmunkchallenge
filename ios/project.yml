# Generates ChipmunkChallenge.xcodeproj with XcodeGen:  brew install xcodegen && xcodegen
name: ChipmunkChallenge
options:
  bundleIdPrefix: com.groveseng
  deploymentTarget:
    iOS: "17.0"
packages:
  ChipmunkEngine:
    path: ../Engine
targets:
  ChipmunkChallenge:
    type: application
    platform: iOS
    dependencies:
      - package: ChipmunkEngine
    sources:
      - path: ChipmunkChallenge
        excludes:
          - Web
          # Boards are reviewed in the separate Board Review app (BoardReviewer/), not in the game.
          - Native/BoardReview.swift
          - Native/board-scores.json
          - Native/pilot-boards.json
      - path: ChipmunkChallenge/Web
        type: folder          # keeps the folder structure inside the app bundle
        buildPhase: resources
    info:
      path: ChipmunkChallenge/Info.plist
      properties:
        CFBundleDisplayName: Chipmunk Challenge
        CFBundleShortVersionString: $(MARKETING_VERSION)   # the version and build come from the settings below
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchSky          # the splash screen's sky, so launch flows straight into it
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        ITSAppUsesNonExemptEncryption: false
        SCNDisableLinearSpaceRendering: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.groveseng.chipmunkchallenge
        TARGETED_DEVICE_FAMILY: "1"      # iPhone only
        MARKETING_VERSION: "2.1"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: 4ET52CG8GF
        CODE_SIGN_STYLE: Automatic
